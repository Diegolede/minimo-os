# Paleta de hyprtoolkit (diálogo de contraseña de hyprpolkitagent ≥ 0.2) con el aspecto de
# Minimo, tema oscuro. install.sh enlaza ~/.config/hypr/hyprtoolkit.conf aquí solo si no
# había uno propio; la shell cambia el enlace a claro.conf con el tema claro.
# Claves: https://wiki.hypr.land/Hypr-Ecosystem/hyprtoolkit/

background = 0xFF1C1C1E          # ventana: casi negro (tarjeta oscura de la shell)
base = 0xFF2C2C2E                # campo de contraseña y botones secundarios
alternate_base = 0xFF2C2C2E      # = base: el filete de 1 px del campo queda invisible
text = 0xFFF5F5F7
bright_text = 0xFF0A0A0B         # (no se usa con acento claro: el texto toma background)
accent = 0xFFF5F5F7              # botón Autenticar: blanco (texto oscuro)
accent_secondary = 0xFFAEAEB2

font_family = Adwaita Sans
font_family_monospace = Adwaita Mono
h1_size = 20
h2_size = 16
h3_size = 14
font_size = 13
small_font_size = 11

rounding_large = 20
rounding_small = 12
