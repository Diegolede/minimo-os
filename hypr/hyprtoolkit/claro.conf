# Paleta de hyprtoolkit (diálogo de contraseña de hyprpolkitagent ≥ 0.2) con el aspecto de
# Minimo, tema claro. install.sh enlaza ~/.config/hypr/hyprtoolkit.conf aquí solo si no
# había uno propio; la shell cambia el enlace a oscuro.conf con el tema oscuro.
# Claves: https://wiki.hypr.land/Hypr-Ecosystem/hyprtoolkit/

background = 0xFFFFFFFF          # ventana: blanco puro
base = 0xFFF2F2F7                # campo de contraseña y botones secundarios (gris de campo)
alternate_base = 0xFFF2F2F7      # = base: el filete de 1 px del campo queda invisible
text = 0xFF0A0A0B
bright_text = 0xFFFFFFFF         # texto sobre el botón negro
accent = 0xFF0A0A0B              # botón Autenticar: negro (texto blanco)
accent_secondary = 0xFF636366

font_family = Adwaita Sans
font_family_monospace = Adwaita Mono
h1_size = 20
h2_size = 16
h3_size = 14
font_size = 13
small_font_size = 11

rounding_large = 20
rounding_small = 12
