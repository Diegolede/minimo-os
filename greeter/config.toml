# /etc/greetd/config.toml — Minimo OS (lo instala greeter/install-greeter.sh)
[terminal]
vt = 1

[default_session]
command = "/usr/local/bin/minimo-greeter"
user = "greeter"

# Recuperación: si la pantalla de Minimo no arranca, cambiá a una consola (Ctrl+Alt+F3),
# entrá con tu usuario y reemplazá la línea `command` de arriba por:
# command = "tuigreet --time --remember --asterisks --cmd start-hyprland"
# o volvé a GDM:  sudo systemctl disable greetd && sudo systemctl enable gdm && reboot
